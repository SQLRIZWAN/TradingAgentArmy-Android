name: Android Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android platform 35
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;34.0.0" >/dev/null || true
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;34" || true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          fi

      - name: Inject google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Auto-increment versionCode
        if: github.ref == 'refs/heads/main'
        run: |
          CUR=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NEXT=$((CUR + 1))
          sed -i "s/versionCode = $CUR/versionCode = $NEXT/" app/build.gradle.kts
          echo "VERSION_CODE=$NEXT" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git diff --cached --quiet || git commit -m "chore: bump versionCode to $NEXT [skip ci]"
          git push || true

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TradingAgentArmy-v${V}-release.apk"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"

      - name: Changelog
        id: log
        run: |
          {
            echo "body<<EOF"
            git log --pretty=format:'- %s' -10
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: AI Trading Army v${{ steps.apk.outputs.version }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: ${{ steps.log.outputs.body }}
          files: dist/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingAgentArmy-v${{ steps.apk.outputs.version }}
          path: dist/*.apk
