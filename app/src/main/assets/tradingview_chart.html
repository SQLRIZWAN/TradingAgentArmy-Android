<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Trading Chart</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#101722;color:#9aaac0;font-family:-apple-system,Roboto,sans-serif}
  #tv_chart{width:100%;height:100%}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#101722;z-index:5}
  #boot .bar{width:180px;height:3px;background:#1c2938;border-radius:3px;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:40%;background:#48d6a5;animation:slide 1.1s infinite ease-in-out}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  #fallback{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#101722;z-index:6;padding:20px;text-align:center}
  #fallback button{background:#1d9b78;color:#04150f;border:0;border-radius:8px;padding:10px 18px;font-weight:700}
  #fallback button.ghost{background:transparent;color:#8de6c0;border:1px solid #2a4a41}
  #badge{position:fixed;top:6px;left:8px;font-size:10px;color:#8de6c0;background:#18332f;padding:3px 7px;border-radius:6px;z-index:4;pointer-events:none}
</style>
</head>
<body>
<div id="badge" style="display:none">● REAL-TIME</div>
<div id="tv_chart"></div>
<div id="boot"><div style="font-size:13px">Loading real TradingView chart…</div><div class="bar"><i></i></div></div>
<div id="fallback">
  <div style="font-size:14px;color:#e6edf3">TradingView chart load nahi hua (network slow / blocked)</div>
  <button onclick="location.reload()">⟳ Retry TradingView</button>
  <button class="ghost" onclick="window.__chartFallback&&window.__chartFallback()">Use offline chart</button>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var symbol = q.get('symbol') || 'BINANCE:BTCUSDT';
  var interval = q.get('interval') || '15';
  var ready = false, timer = 0;

  window.__tvReady = false;
  window.__tvSymbol = symbol;

  function markReady(){
    if (ready) return;
    ready = true;
    window.__tvReady = true;
    var b = document.getElementById('boot'); if (b) b.style.display = 'none';
    var badge = document.getElementById('badge'); if (badge) badge.style.display = 'block';
  }

  function mount(){
    if (typeof TradingView === 'undefined') return;
    try {
      new TradingView.widget({
        autosize: true,
        symbol: symbol,
        interval: interval,
        timezone: "Etc/UTC",
        theme: "dark",
        style: "1",
        locale: "en",
        toolbar_bg: "#101722",
        enable_publishing: false,
        allow_symbol_change: true,
        save_image: true,
        hide_side_toolbar: false,
        details: true,
        calendar: true,
        hotlist: true,
        withdateranges: true,
        studies: ["MASimple@tv-basicstudies", "RSI@tv-basicstudies"],
        show_popup_button: true,
        popup_width: "1000",
        popup_height: "650"
      });
      markReady();
    } catch (e) { /* retry below */ }
  }

  var s = document.createElement('script');
  s.src = 'https://s3.tradingview.com/tv.js';
  s.async = true;
  s.onload = mount;
  s.onerror = function(){ fail(); };
  document.head.appendChild(s);

  function fail(){
    var b = document.getElementById('boot'); if (b) b.style.display = 'none';
    var f = document.getElementById('fallback'); if (f) f.style.display = 'flex';
  }

  // poll: widget mounted or give up
  timer = setInterval(function(){
    if (ready) { clearInterval(timer); return; }
    if (typeof TradingView !== 'undefined') { mount(); }
  }, 500);

  setTimeout(function(){ clearInterval(timer); if (!ready) fail(); }, 12000);

  // Android side can swap to the bundled offline chart
  window.__setSymbol = function(sym, iv){
    window.location.search = '?symbol=' + encodeURIComponent(sym) + '&interval=' + encodeURIComponent(iv || interval);
  };
})();
</script>
</body>
</html>
